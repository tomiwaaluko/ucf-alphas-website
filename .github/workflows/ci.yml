name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN is not needed after checkout; leaving it in
          # the git config would expose it to any later step.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines and .nvmrc.
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # Fails the build on a high or critical advisory in the dependency tree.
      # Nothing checked this before, so vulnerable transitive deps could ship
      # to production unnoticed.
      #
      # This deliberately does not run `npm audit --audit-level=high`. That
      # fails on every high/critical advisory including ones with no available
      # fix, which pins the job red for reasons no pull request can address -
      # and a gate nobody can satisfy is one people learn to scroll past. The
      # gate blocks only on advisories that can actually be cleared today, and
      # prints the rest with the reason they cannot be.
      - name: Dependency audit
        env:
          AUDIT_WORKSPACE: "."
        run: node .github/scripts/audit-gate.mjs
